version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # wire-mesh-core, cc-peer and web-ui-primitives are bumped the moment they publish by sibling-dependency-update.yml, so a scheduled scan would only open a second pull request for the same version.
    ignore:
      - dependency-name: wire-mesh-core
      - dependency-name: cc-peer
      - dependency-name: web-ui-primitives

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

  # The Rust workspace's lock file and its toolchain pin. The cargo-deny version the workflows install is outside both ecosystems, and scripts/check-tool-pins.py checks it on a schedule.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: rust-toolchain
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
